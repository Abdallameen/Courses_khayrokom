<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدورات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --ink: #1c2321;
    --muted: #5d6965;
    --line: #dfe4e1;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121715;
      --card: #1a211e;
      --ink: #eef2f0;
      --muted: #9aa8a2;
      --line: #2a3430;
      --accent: #4fb89d;
      --accent-ink: #0d1411;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
    line-height: 1.7;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 20px; }
  .course {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .course img { display: block; width: 100%; height: auto; }
  .course-body { padding: 14px 16px 16px; }
  .course-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
  .course-dates { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .links a:first-child { background: var(--accent); color: var(--accent-ink); }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>الدورات المتاحة</h1>
  <div id="courses"><p class="msg">جاري التحميل…</p></div>
</main>

<script>
/* ============ الإعدادات ============
   1) الصق هنا رابط الـ CSV المنشور من Google Sheet
   2) غيّر المنطقة الزمنية لو احتجت
*/
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRU7QCBLs2HTHwaEW5ot7DpTg-5GrxQZiSFQwiWQ85_G3pAmMG0qicM1hLLybXDG3NXjdU9YLk8Bm-P/pub?output=csv";
const TIMEZONE = "Asia/Riyadh";
/* =================================== */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function safeUrl(u) {
  u = (u || "").trim();
  return /^https?:\/\//i.test(u) ? u : "";
}

// قارئ CSV يدعم الفواصل والأسطر داخل علامات التنصيص
function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

// يحوّل رابط صورة Google Drive العادي إلى رابط يعمل داخل الصفحة
function imageUrl(u) {
  u = safeUrl(u);
  if (!u) return "";
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
  return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200" : u;
}

function normDate(s) {
  return (s || "").trim().replace(/\//g, "-").slice(0, 10);
}

function render(courses) {
  const box = document.getElementById("courses");
  if (!courses.length) {
    box.innerHTML = '<p class="msg">لا توجد دورات معروضة اليوم.</p>';
    return;
  }
  box.innerHTML = courses.map(c => {
    const img = imageUrl(c.image);
    const links = c.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)}</a>`).join("");
    return `
      <article class="course">
        ${img ? `<img src="${esc(img)}" alt="${esc(c.title || "بروشور الدورة")}">` : ""}
        <div class="course-body">
          ${c.title ? `<h2 class="course-title">${esc(c.title)}</h2>` : ""}
          ${links ? `<div class="links">${links}</div>` : ""}
        </div>
      </article>`;
  }).join("");
}

async function load() {
  const box = document.getElementById("courses");
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text());
    const head = rows.shift().map(h => h.trim().toLowerCase());
    const col = name => head.indexOf(name);

    const today = new Date().toLocaleDateString("en-CA", { timeZone: TIMEZONE }); // YYYY-MM-DD

    const courses = rows.map(r => {
      const get = n => (col(n) >= 0 ? (r[col(n)] || "").trim() : "");
      const links = [];
      for (let i = 1; i <= 5; i++) {
        const url = safeUrl(get("link" + i + "_url"));
        if (url) links.push({ text: get("link" + i + "_text") || "فتح الرابط", url });
      }
      return { from: normDate(get("from")), to: normDate(get("to")), title: get("title"), image: get("image"), links };
    }).filter(c => c.from && c.to && today >= c.from && today <= c.to);

    render(courses);
  } catch (e) {
    box.innerHTML = '<p class="msg">تعذّر تحميل الدورات. حاول مرة أخرى بعد قليل.</p>';
  }
}
load();
</script>
</body>
</html>
