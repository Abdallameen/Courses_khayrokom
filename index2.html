<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدورات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --ink: #1c2321;
    --muted: #5d6965;
    --line: #dfe4e1;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --soft: #e8f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121715;
      --card: #1a211e;
      --ink: #eef2f0;
      --muted: #9aa8a2;
      --line: #2a3430;
      --accent: #4fb89d;
      --accent-ink: #0d1411;
      --soft: #1f2b27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
    line-height: 1.7;
  }
  body.locked { overflow: hidden; }
  button { font-family: inherit; }

  /* ---------- الرأس ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 760px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .top h1 { font-size: 1.35rem; margin: 0; }
  .open-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent);
    font-weight: 600; font-size: .95rem; cursor: pointer;
  }
  .open-btn:focus-visible, .close-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .badge {
    min-width: 22px; padding: 0 6px; border-radius: 11px;
    background: var(--accent); color: var(--accent-ink);
    font-size: .8rem; line-height: 22px; text-align: center;
  }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  .intro { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }

  /* ---------- البطاقات ---------- */
  .course {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .course img { display: block; width: 100%; height: auto; min-height: 200px; background: var(--line); }
  .course img.loaded { min-height: 0; }
  .course-body { padding: 14px 16px 16px; }
  .status {
    display: inline-block; padding: 1px 10px; margin-bottom: 6px;
    border-radius: 999px; background: var(--soft); color: var(--accent);
    font-size: .82rem; font-weight: 600;
  }
  .course-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 2px; }
  .course-dates { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    display: inline-block; padding: 10px 18px; border-radius: 10px;
    border: 1px solid var(--accent); color: var(--accent);
    text-decoration: none; font-weight: 600;
  }
  .links a:first-child { background: var(--accent); color: var(--accent-ink); }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { text-align: center; color: var(--muted); padding: 40px 0; }
  .msg button {
    margin-top: 10px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }

  /* ---------- القائمة الجانبية ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.45);
    opacity: 0; visibility: hidden;
    transition: opacity .25s, visibility 0s .25s;
  }
  .overlay.open { opacity: 1; visibility: visible; transition: opacity .25s; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
    width: min(460px, 100%);
    background: var(--bg);
    display: flex; flex-direction: column;
    transform: translateX(-100%); visibility: hidden;
    transition: transform .25s ease, visibility 0s .25s;
  }
  .drawer.open { transform: none; visibility: visible; transition: transform .25s ease; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 { font-size: 1.2rem; margin: 0; }
  .close-btn {
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.1rem;
  }
  .drawer-body { overflow-y: auto; padding: 16px; flex: 1; }
  .drawer-body h3 { font-size: 1rem; margin: 22px 0 10px; }
  .drawer-body h3:first-child { margin-top: 0; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; background: var(--soft); }
  tr:last-child td { border-bottom: 0; }
  td.date { white-space: nowrap; color: var(--muted); }
  .tlink { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .tlink:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .overlay, .drawer { transition: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>الدورات القريبة</h1>
    <button class="open-btn" id="openBtn" hidden aria-haspopup="dialog">
      الدورات القادمة <span class="badge" id="count">0</span>
    </button>
  </div>
</header>

<main>
  <p class="intro">الدورات الجارية الآن أو التي تبدأ خلال الأيام القادمة.</p>
  <div id="courses"><p class="msg">جاري التحميل…</p></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawerTitle">الدورات القادمة</h2>
    <button class="close-btn" id="closeBtn" aria-label="إغلاق">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
/* ============ الإعدادات ============ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRU7QCBLs2HTHwaEW5ot7DpTg-5GrxQZiSFQwiWQ85_G3pAmMG0qicM1hLLybXDG3NXjdU9YLk8Bm-P/pub?output=csv";
const TIMEZONE      = "Asia/Riyadh";
const NEAR_DAYS     = 14;   // "الدورات القريبة": اللي تبدأ خلال كم يوم من اليوم
const UPCOMING_DAYS = 90;   // "الدورات القادمة": نعرض لحد كم يوم قدام
/* =================================== */

const DAY = 86400000;
let nearList = [], upcomingList = [], allList = [], drawerBuilt = false, lastFocus = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(u) { u = (u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function imageUrl(u) {
  u = safeUrl(u);
  if (!u) return "";
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
  return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200" : u;
}

/* ---------- التواريخ ---------- */
const normDate = s => (s || "").trim().replace(/\//g, "-").slice(0, 10);
const validDate = s => /^\d{4}-\d{1,2}-\d{1,2}$/.test(s);
const toUTC = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / DAY);

function fmt(s, withYear) {
  const o = { day: "numeric", month: "long", timeZone: "UTC" };
  if (withYear) o.year = "numeric";
  return new Date(toUTC(s)).toLocaleDateString("ar-EG", o);
}
function dateRange(c, todayYear) {
  const y = c.from.slice(0, 4) !== todayYear || c.to.slice(0, 4) !== todayYear;
  return c.from === c.to ? fmt(c.from, y) : fmt(c.from, y) + " – " + fmt(c.to, y);
}
function statusText(c) {
  if (c.startIn < 0) return "جارية الآن";
  if (c.startIn === 0) return "تبدأ اليوم";
  if (c.startIn === 1) return "تبدأ غدًا";
  if (c.startIn === 2) return "تبدأ بعد يومين";
  if (c.startIn <= 10) return "تبدأ بعد " + c.startIn + " أيام";
  return "تبدأ بعد " + c.startIn + " يومًا";
}

/* ---------- العرض ---------- */
let todayYear = "";

function card(c, showStatus) {
  const img = imageUrl(c.image);
  const links = c.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)}</a>`).join("");
  return `
    <article class="course">
      ${img ? `<img src="${esc(img)}" alt="${esc(c.title || "بروشور الدورة")}" loading="lazy" decoding="async"
                onload="this.classList.add('loaded')" onerror="this.remove()">` : ""}
      <div class="course-body">
        ${showStatus ? `<span class="status">${statusText(c)}</span>` : ""}
        ${c.title ? `<h2 class="course-title">${esc(c.title)}</h2>` : ""}
        <p class="course-dates">${dateRange(c, todayYear)}</p>
        ${links ? `<div class="links">${links}</div>` : ""}
      </div>
    </article>`;
}

function renderNear() {
  const box = document.getElementById("courses");
  if (!nearList.length) {
    box.innerHTML = `<p class="msg">لا توجد دورات قريبة حاليًا.${allList.length ? `<br><button type="button" id="emptyOpen">شاهد الدورات القادمة</button>` : ""}</p>`;
    const b = document.getElementById("emptyOpen");
    if (b) b.addEventListener("click", openDrawer);
    return;
  }
  box.innerHTML = nearList.map(c => card(c, true)).join("");
}

function buildDrawer() {
  if (drawerBuilt) return;
  drawerBuilt = true;
  const body = document.getElementById("drawerBody");
  if (!allList.length) { body.innerHTML = '<p class="msg">لا توجد دورات قادمة حاليًا.</p>'; return; }

  const rows = allList.map(c => {
    const l = c.links[0];
    return `<tr>
      <td class="date">${dateRange(c, todayYear)}</td>
      <td>${esc(c.title || "دورة")}</td>
      <td>${l ? `<a class="tlink" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)}</a>` : ""}</td>
    </tr>`;
  }).join("");

  body.innerHTML = `
    <h3>جدول الدورات</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>التاريخ</th><th>الدورة</th><th>الرابط</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${upcomingList.length ? `<h3>بروشورات الدورات القادمة</h3>${upcomingList.map(c => card(c, false)).join("")}` : ""}
  `;
}

/* ---------- فتح وإغلاق القائمة ---------- */
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");

function openDrawer() {
  buildDrawer();
  lastFocus = document.activeElement;
  drawer.classList.add("open"); overlay.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  document.body.classList.add("locked");
  document.getElementById("closeBtn").focus();
}
function closeDrawer() {
  drawer.classList.remove("open"); overlay.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  document.body.classList.remove("locked");
  if (lastFocus) lastFocus.focus();
}
document.getElementById("openBtn").addEventListener("click", openDrawer);
document.getElementById("closeBtn").addEventListener("click", closeDrawer);
overlay.addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer(); });

/* ---------- التحميل ---------- */
async function load() {
  const box = document.getElementById("courses");
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text());
    const head = rows.shift().map(h => h.trim().toLowerCase());
    const col = n => head.indexOf(n);

    const today = new Date().toLocaleDateString("en-CA", { timeZone: TIMEZONE }); // YYYY-MM-DD
    todayYear = today.slice(0, 4);

    const all = rows.map(r => {
      const get = n => (col(n) >= 0 ? (r[col(n)] || "").trim() : "");
      const links = [];
      for (let i = 1; i <= 5; i++) {
        const url = safeUrl(get("link" + i + "_url"));
        if (url) links.push({ text: get("link" + i + "_text") || "فتح الرابط", url });
      }
      const from = normDate(get("from")), to = normDate(get("to"));
      return { from, to, title: get("title"), image: get("image"), links };
    })
    .filter(c => validDate(c.from) && validDate(c.to))
    .map(c => ({ ...c, startIn: dayDiff(today, c.from), endIn: dayDiff(today, c.to) }))
    .filter(c => c.endIn >= 0 && c.startIn <= UPCOMING_DAYS)   // مش منتهية، وفي حدود الفترة
    .sort((a, b) => a.startIn - b.startIn);

    allList      = all;
    nearList     = all.filter(c => c.startIn <= NEAR_DAYS);
    upcomingList = all.filter(c => c.startIn >  NEAR_DAYS);

    renderNear();
    if (allList.length) {
      document.getElementById("count").textContent = allList.length;
      document.getElementById("openBtn").hidden = false;
    }
  } catch (e) {
    box.innerHTML = '<p class="msg">تعذّر تحميل الدورات. حاول مرة أخرى بعد قليل.</p>';
  }
}
load();
</script>
</body>
</html>
