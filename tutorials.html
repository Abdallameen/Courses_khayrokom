<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شروحات المنصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --ink: #1c2321;
    --muted: #5d6965;
    --line: #dfe4e1;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --soft: #e8f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121715;
      --card: #1a211e;
      --ink: #eef2f0;
      --muted: #9aa8a2;
      --line: #2a3430;
      --accent: #4fb89d;
      --accent-ink: #0d1411;
      --soft: #1f2b27;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
    line-height: 1.7;
  }
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 760px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .top h1 { font-size: 1.35rem; margin: 0; }
  .back {
    padding: 9px 16px; border-radius: 10px; text-decoration: none;
    border: 1px solid var(--accent); color: var(--accent); background: var(--card);
    font-weight: 600; font-size: .95rem;
  }
  .back:focus-visible, .play:focus-visible, .index a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 56px; }

  .index {
    list-style: none; margin: 0 0 24px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .index li + li { margin-top: 4px; }
  .index a { color: var(--ink); text-decoration: none; }
  .index a:hover { color: var(--accent); }
  .index b { color: var(--accent); margin-inline-start: 4px; }

  .video {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; margin-bottom: 22px;
    scroll-margin-top: 80px;
  }
  .video-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700;
  }
  .video-head h2 { font-size: 1.1rem; margin: 0; }

  .player { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .player iframe, .player video, .player .poster {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .poster { object-fit: cover; opacity: .85; }
  .play {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; padding: 0; cursor: pointer; background: transparent;
    display: grid; place-items: center;
  }
  .play span {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--accent); display: grid; place-items: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  .play span::after {
    content: ""; margin-inline-start: -4px;
    border-style: solid; border-width: 11px 0 11px 18px;
    border-color: transparent transparent transparent var(--accent-ink);
  }
  .soon {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #cfd8d4; background: #1a211e; font-size: .95rem;
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>شروحات المنصة</h1>
    <a class="back" href="courses.html">← العودة للدورات</a>
  </div>
</header>

<main>
  <ol class="index" id="index"></ol>
  <div id="videos"></div>
</main>

<script>
/* ============ ضع روابط الفيديوهات هنا ============
   يقبل: رابط يوتيوب، أو رابط ملف من Google Drive، أو رابط مباشر لملف mp4.
   اترك الرابط فاضي "" والفيديو هيظهر "قريبًا".
================================================== */
const VIDEOS = [
  { title: "التسجيل في المنصة وتفعيل الحساب", url: "" },
  { title: "التسجيل في دورة تدريبية",          url: "" },
  { title: "مشاهدة الدورة",                    url: "" },
  { title: "الحصول على الشهادة",               url: "" },
  { title: "طريقة تسجيل الدخول",               url: "" }
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function parseVideo(u) {
  u = (u || "").trim();
  if (!/^https?:\/\//i.test(u)) return null;
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return { type: "yt", id: m[1] };
  m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
  if (m) return { type: "drive", id: m[1] };
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(u)) return { type: "file", url: u };
  return null;
}

function playerHTML(v, title) {
  if (!v) return '<div class="soon">الفيديو قريبًا</div>';
  if (v.type === "file") {
    return `<video controls preload="none" playsinline src="${esc(v.url)}"></video>`;
  }
  const poster = v.type === "yt"
    ? `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`
    : `https://drive.google.com/thumbnail?id=${v.id}&sz=w800`;
  return `
    <img class="poster" src="${poster}" alt="" loading="lazy" decoding="async" onerror="this.remove()">
    <button class="play" type="button" data-type="${v.type}" data-id="${v.id}" aria-label="تشغيل: ${esc(title)}"><span></span></button>`;
}

function mount(btn) {
  const { type, id } = btn.dataset;
  const src = type === "yt"
    ? `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`
    : `https://drive.google.com/file/d/${id}/preview`;
  btn.parentElement.innerHTML =
    `<iframe src="${src}" title="فيديو الشرح" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}

document.getElementById("index").innerHTML = VIDEOS.map((v, i) =>
  `<li><a href="#v${i + 1}"><b>${i + 1}.</b> ${esc(v.title)}</a></li>`).join("");

document.getElementById("videos").innerHTML = VIDEOS.map((v, i) => `
  <section class="video" id="v${i + 1}">
    <div class="video-head"><span class="num">${i + 1}</span><h2>${esc(v.title)}</h2></div>
    <div class="player">${playerHTML(parseVideo(v.url), v.title)}</div>
  </section>`).join("");

document.getElementById("videos").addEventListener("click", e => {
  const b = e.target.closest(".play");
  if (b) mount(b);
});
</script>
</body>
</html>
